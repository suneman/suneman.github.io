name: Refresh popular posts

# Weekly: pull pageview stats from GoatCounter and refresh the homepage's
# "Most read" data. Commits only when the JSON actually changes — the file
# carries a month stamp, so a commit (and therefore a site rebuild, which
# also rotates the archive pick) happens at least once a month.
#
# Pushes made with GITHUB_TOKEN don't trigger push workflows, so after
# committing we dispatch deploy.yml explicitly.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch stats from GoatCounter
        run: node scripts/popular-posts.mjs
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}

      - name: Commit if changed and trigger deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet src/data/popular-posts.json; then
            echo "No change in popular posts; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/popular-posts.json
          git commit -m "Refresh popular-posts data from GoatCounter"
          git push
          gh workflow run deploy.yml --ref main
